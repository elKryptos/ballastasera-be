server {
    listen 80;
    server_name _;
    # 10MB de archivo + margen para los metadatos multipart (max-request-size=11MB)
    client_max_body_size 11M;

    # Lectura publica de los objetos de RustFS (solo GET/HEAD)
    location /media/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://rustfs:9000/ballastasera-media/;
        proxy_set_header Host rustfs:9000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_hide_header x-amz-request-id;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Backend Spring Boot ejecutado en el host
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
