# ============================================================================
#  BallaStasera - PostgreSQL + PostGIS + RustFS in Docker
#  Avvia dalla radice del repository:
#  docker compose --env-file infra/.env -f infra/docker-compose.yml up -d
#
#  I file SQL vengono caricati automaticamente solo al primo avvio,
#  quando il volume dati è vuoto.
# ============================================================================

name: ballastasera

services:
  postgres:
    image: postgis/postgis:18-3.6 # PostgreSQL 18 con PostGIS incluso
    container_name: postgresql
    restart: unless-stopped
    # Le variabili DB_* sono condivise con Spring Boot tramite ballastasera/.env.
    # Il fallback changeme è accettabile solo per lo sviluppo locale.
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ballastasera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-ballastasera}
    ports:
      - "${DB_PORT:-5432}:5432" # host:container - connettiti a localhost:5432
    volumes:
      - postgresql_data:/var/lib/postgresql # dati persistenti (mount PostgreSQL 18+)
      # Percorsi reali dei file SQL nella cartella docs/.
      - ../docs/ballastasera_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../docs/02_postgis.sql:/docker-entrypoint-initdb.d/02_postgis.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-ballastasera} -d ${DB_NAME:-ballastasera}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:2.27.49
    container_name: rustfs-init
    depends_on:
      - rustfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      AWS_DEFAULT_REGION: ${RUSTFS_REGION:-us-east-1}
      MEDIA_BUCKET: ${RUSTFS_BUCKET:-ballastasera-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3api list-buckets --endpoint-url http://rustfs:9000 >/dev/null 2>&1; do
          echo "Waiting for RustFS..."
          sleep 2
        done

        aws s3api head-bucket \
          --bucket "$${MEDIA_BUCKET}" \
          --endpoint-url http://rustfs:9000 >/dev/null 2>&1 \
        || aws s3api create-bucket \
          --bucket "$${MEDIA_BUCKET}" \
          --endpoint-url http://rustfs:9000

        policy="$$(printf '{"Version":"2012-10-17","Statement":[{"Sid":"PublicReadMedia","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::%s/*"}]}' "$${MEDIA_BUCKET}")"

        aws s3api put-bucket-policy \
          --bucket "$${MEDIA_BUCKET}" \
          --policy "$${policy}" \
          --endpoint-url http://rustfs:9000

        echo "RustFS bucket '$${MEDIA_BUCKET}' is ready"

  nginx:
    image: nginx:1.27-alpine
    container_name: ballastasera-nginx
    restart: unless-stopped
    depends_on:
      - rustfs
    ports:
      - "${MEDIA_PROXY_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgresql_data:
  rustfs_data:
