# ============================================================================
#  BallaStasera - PostgreSQL + PostGIS database in Docker
#  Avvia dalla radice del repository:
#  docker compose --env-file ballastasera/.env -f infra/docker-compose.yml up -d
#
#  I file SQL vengono caricati automaticamente solo al primo avvio,
#  quando il volume dati è vuoto.
# ============================================================================

name: ballastasera

services:
# --- DATABASE ---
  postgres:
    image: postgis/postgis:18-3.6 # PostgreSQL 18 con PostGIS incluso
    container_name: postgresql
    restart: unless-stopped
    # Le variabili DB_* sono condivise con Spring Boot tramite ballastasera/.env.
    # Il fallback changeme è accettabile solo per lo sviluppo locale.
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432" # host:container - connettiti a localhost:5432
    volumes:
      - postgresql_data:/var/lib/postgresql # dati persistenti (mount PostgreSQL 18+)
      # Percorsi reali dei file SQL nella cartella docs/.
      #- ../docs/ballastasera_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      #- ../docs/02_postgis.sql:/docker-entrypoint-initdb.d/02_postgis.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      
# --- OBJECT STORAGE ---
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_server
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Dashboard Web
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_USER}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      
# --- REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Permite a NGINX resolver "host.docker.internal" en cualquier OS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NGINX parte solo cuando los demas partes y estan sin errores
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      
# --- INFRASTRUCTURE ---
networks:
  app-network:
      driver: bridge

volumes:
  postgresql_data:
  rustfs_data:
