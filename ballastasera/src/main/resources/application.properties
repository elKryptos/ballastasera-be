spring.application.name=ballastasera

server.forward-headers-strategy=framework

# Porta (8080 occupata da Apache locale)
server.port=${SERVER_PORT:8080}

# Carica le variabili dal file .env del progetto e dalle credenziali di infra/.env
spring.config.import=optional:file:.env[.properties],optional:file:../infra/.env[.properties]

# Configurazione PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Riduce il livello di logging per Hibernate
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.root=INFO
logging.level.com.startup.announce=DEBUG

# Spring security oauth2 google
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email

# JWT (sessione stateless)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Log ogni richiesta autenticata (metodo + path) sulla console del BE
app.logging.requests=${LOG_REQUESTS:false}

# Frontend Angular - redirect dopo login Google
app.frontend.oauth2-redirect-uri=${FRONTEND_OAUTH2_REDIRECT_URI}

# Resend email
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_EMAIL_FROM}
frontend.url=${FRONTEND_URL}

# Geocoding (Nominatim / OpenStreetMap) - richiesto uno User-Agent identificativo dal ToS
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=Ballastasera/1.0 (${CONTACT_EMAIL:contact@ballastasera.app})

# RUSTFS
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=11MB
storage.endpoint=${RUSTFS_ENDPOINT}
storage.region=${RUSTFS_REGION:eu-central-1}
storage.raw-bucket=${RUSTFS_RAW_BUCKET}
storage.bucket=${RUSTFS_BUCKET}
storage.access-key=${RUSTFS_USER}
storage.secret-key=${RUSTFS_PASSWORD}
storage.public-base-url=${MEDIA_PUBLIC_URL:http://localhost/media}
